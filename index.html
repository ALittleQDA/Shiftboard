<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Shift Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app, sticky header, fixed bottom tab bar; hi-vis floor-marking yellow as the single accent */
:root{
  --bg:#F1F3EF; --surface:#FFFFFF; --sunk:#E7EAE5; --fg:#1B1F1D; --muted:#5C655F; --line:#D3D8D1;
  --accent:#F2C200; --accent-ink:#1B1F1D; --good:#1D7A4B; --bad:#B3261E;
  --t1:#2F6FD6; --t2:#D9542B; --t3:#2E9E62; --t4:#8A4FD1; --t5:#C2368A; --t6:#1E9AAE; --t7:#B07A12; --t8:#5E6B78;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131615; --surface:#1D211F; --sunk:#262B28; --fg:#ECEFEA; --muted:#9AA39D; --line:#343B37;
  --accent:#F5C400; --accent-ink:#151816; --good:#4CC38A; --bad:#F2836B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131615; --surface:#1D211F; --sunk:#262B28; --fg:#ECEFEA; --muted:#9AA39D; --line:#343B37;
  --accent:#F5C400; --accent-ink:#151816; --good:#4CC38A; --bad:#F2836B; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
header h1{margin:0;white-space:nowrap;font-family:var(--display);font-size:22px;letter-spacing:.02em;text-transform:uppercase;flex:1}
header h1 span{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:0 6px;margin-right:6px}
.iconbtn{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;height:38px;padding:0 12px;font:600 14px var(--body)}
main{padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{background:none;border:0;color:var(--muted);font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:14px 2px;border-top:4px solid transparent}
nav button[aria-current="page"]{color:var(--fg);border-top-color:var(--accent)}
h2{font-family:var(--display);font-size:26px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.sec{font:700 13px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:0}
input,select,textarea{font:500 17px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
input.num{font-family:var(--display);font-size:20px;text-align:center;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;min-height:46px;padding:0 16px;font:700 16px var(--display);letter-spacing:.04em;text-transform:uppercase}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.warn{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.warn.armed{background:var(--bad);color:var(--surface)}
.btn:disabled{opacity:.4}
.x{background:none;border:0;color:var(--muted);font-size:22px;width:40px;height:40px;flex:none}
.grid3{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:8px;align-items:center}
.out{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;text-align:center}
.pill{display:inline-block;font:700 13px var(--display);letter-spacing:.05em;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.area{display:grid;grid-template-columns:minmax(0,1fr) 76px 76px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.area:last-child{border-bottom:0}
.area .name{font-weight:600;min-width:0}
.area .meta{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;flex:1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.colhead{display:grid;grid-template-columns:minmax(0,1fr) 76px 76px;gap:8px;font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.colhead span:first-child{text-align:left}
.big{display:flex;gap:10px}
.big .card{flex:1;text-align:center}
.big b{display:block;font:700 30px var(--display);font-variant-numeric:tabular-nums}
.big small{color:var(--muted);font-size:13px}
.role h3{margin:0 0 8px;font:700 17px var(--display);display:flex;justify-content:space-between;gap:8px;align-items:center}
.role .lbl{font-size:14px;color:var(--muted)}
.pmrow{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pmrow:last-child{border-bottom:0}
.pmrow .calc{background:var(--sunk);border-radius:8px;min-height:44px;display:flex;align-items:center;justify-content:center}
pre.email{white-space:pre-wrap;word-break:break-word;font:15px/1.5 var(--body);background:var(--sunk);border-radius:8px;padding:12px;margin:0}
.hawb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hawb .wide{grid-column:1/-1}
.tk{border-left:8px solid var(--tk,var(--line))}
.tkb{display:inline-block;background:var(--tk);color:#fff;font:700 15px var(--display);letter-spacing:.04em;padding:3px 10px;border-radius:6px;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.tkline{font-size:13px;color:var(--muted);margin:-2px 0 8px;display:flex;gap:8px;align-items:center}
.hawb-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hawb-head input{font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20}
.note{font-size:14px;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center}
.empty p{color:var(--muted)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.dayhead .d{font:700 30px var(--display)}
.dayhead .w{color:var(--muted);font:600 16px var(--display);text-transform:uppercase;letter-spacing:.08em}
.daynav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
canvas#cell{width:100%;display:block;border-radius:8px;background:#fff;border:1px solid var(--line)}
.calwrap{position:relative;max-width:100%;touch-action:manipulation}
.calwrap img{display:block;width:100%;border-radius:6px;user-select:none;-webkit-user-select:none}
.mark{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:3px solid var(--bad);border-radius:50%;pointer-events:none;background:color-mix(in srgb,var(--bad) 25%,transparent)}
.hl{position:absolute;border:3px solid var(--bad);pointer-events:none;border-radius:3px}
.gridline{position:absolute;border:1px dashed var(--bad);pointer-events:none;opacity:.6}
.copyfallback{width:100%;min-height:140px;margin-top:8px;font-size:14px}
@media (prefers-reduced-motion: no-preference){nav button{transition:color .15s}}
</style>

<header>
  <h1><span>Shift</span>Board</h1>
  <span id="saveState" class="pill">…</span>
  <button class="iconbtn" id="setBtn" aria-label="Settings">Settings</button>
</header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="safety">Safety</button>
  <button data-tab="morning">Morning</button>
  <button data-tab="heads">Heads</button>
  <button data-tab="pm">4 PM</button>
  <button data-tab="eod">EOD</button>
</nav>
<input type="file" id="calFile" accept="image/*" hidden>

<script>
(function(){
"use strict";
const KEY="shiftboard:v1";
const ROLES=["Pickers","Receiving & Put-a-way","Inventory Control","Processors","Loaders","DTS","CSR (Transportation) / Floor Lead","Material Handlers","QC","STO Staff","CSD","RMA"];
const PM=[
 {k:"total",l:"Total pallets on load plan",calc:1},{k:"trucks",l:"Total Trucks Scheduled"},{k:"delayed",l:"Delayed Truck arrival"},
 {k:"hhp",l:"HHP"},{k:"acc",l:"ACC"},{k:"shipped",l:"Total Shipped"},{k:"ready",l:"Ready to ship"},{k:"inproc",l:"In-process"},{k:"toprint",l:"Total to be printed"},{k:"manual",l:"Total manual"},
 {h:"eCOM STO"},{k:"e_aged",l:"Aged"},{k:"e_prog",l:"In progress"},{k:"e_ship",l:"Total Shipped"},{k:"e_print",l:"Total to be Printed"},
 {h:"Special Projects"},{k:"s_prog",l:"In progress"},{k:"s_ship",l:"Total Shipped"},{k:"s_print",l:"Total to be printed"},
 {h:"Inbound"},{k:"i_pack",l:"Packaging Anticipated"},{k:"i_air",l:"Airport Anticipated"},{k:"i_del",l:"Total Delivered"},{k:"i_gr",l:"Total GR'd"},{k:"i_pa",l:"Total Put Away"},{k:"i_pend",l:"Total Pending GR",calc:1},
 {h:"Previous Day's Inbound"},{k:"p_air",l:"Airport Anticipated"},{k:"p_del",l:"Total Delivered"},{k:"p_gr",l:"Total GR'd"},{k:"p_pa",l:"Total Putaway"},{k:"p_pend",l:"Total Pending GR"},
 {h:"CSD · D23"},{k:"d23_sto",l:"STO Inbound"},{k:"d23_onh",l:"Apkudo Inbound On-Hand"},{k:"d23_proj",l:"Projected to received (pcs)"},{k:"d23_out",l:"Apkudo Outbound (pcs)"},{k:"d23_enr",l:"ENR Orders (pcs)"},
 {h:"CSD · D24"},{k:"d24_in",l:"Inbound"},{k:"d24_out",l:"Outbound"},
 {h:"CSD · DOA"},{k:"doa_in",l:"Package Inbound (pcs)"},{k:"doa_out",l:"Outbound (pcs)"},
 {h:"DTS"},{k:"ups",l:"UPS Units"},{k:"bestbuy",l:"Best Buy"},{k:"walmart",l:"Walmart units"},
 {h:"RMA"},{k:"rma_tot",l:"Total RMAs"},{k:"rma_df",l:"DF Team RMA Submission"},{k:"rma_sea",l:"SEA LPS – Pending RDO"},{k:"rma_3pl",l:"W/H 3PL- Pending Receipt"}
];
const DEF={tab:"safety",carriers:["Challenger","Werner","Covenant","Schneider","UPS"],
 areas:["Wall","eComm","Special Projects","CE Coppell","KWI","Inbound – Challenger","Container – Werner","Container – Challenger","Container – Covenant","Container – Schneider","UPS"],
 morning:{},head:{},pm:{},eod:{date:"",trucks:[{c:"",cont:false,t:""}],hawbs:[],put:"",expA:"",expC:""},cal:null};

let S=load(), storageOK=true;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(JSON.parse(JSON.stringify(DEF)),o);}}catch(e){storageOK=false}return JSON.parse(JSON.stringify(DEF));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}setSaveState()}
function setSaveState(){const el=document.getElementById("saveState");el.textContent=storageOK?"Saved":"Not saving";el.className="pill "+(storageOK?"good":"bad")}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n=v=>{const x=parseFloat(v);return isNaN(x)?0:x};
const has=v=>v!==""&&v!=null;
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function parseTime(v){v=String(v||"").trim();if(!v)return "";let h,m;
  if(v.includes(":")){[h,m]=v.split(":").map(Number)}else{const d=v.replace(/\D/g,"");if(!d)return "";const x=parseInt(d,10);h=Math.floor(x/100);m=x%100}
  if(isNaN(h)||isNaN(m)||h>23||m>59)return "?";return h+":"+String(m).padStart(2,"0")}
function copyText(text,btn){
  const done=()=>toast("Copied");
  const fallback=()=>{let ta=btn.parentElement.querySelector(".copyfallback");if(!ta){ta=document.createElement("textarea");ta.className="copyfallback";btn.parentElement.appendChild(ta)}ta.value=text;ta.focus();ta.select();toast("Text selected. Tap Copy in the menu.")};
  try{navigator.clipboard.writeText(text).then(done,fallback)}catch(e){fallback()}}
function armClear(btn,fn){if(btn.classList.contains("armed")){fn();return}btn.classList.add("armed");const old=btn.textContent;btn.textContent="Tap again to clear";setTimeout(()=>{btn.classList.remove("armed");btn.textContent=old},3000)}

/* ---------- tabs ---------- */
function go(tab){S.tab=tab;save();document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));render();window.scrollTo(0,0)}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.tab)});
$("#setBtn").addEventListener("click",()=>go("settings"));
function render(){const v=$("#view");({safety:renderSafety,morning:renderMorning,heads:renderHeads,pm:renderPM,eod:renderEOD,settings:renderSettings}[S.tab]||renderSafety)(v)}

/* ---------- SAFETY ---------- */
let calImg=null, calURL=null, calStep=0, calPts=[], curDay=null, showFull=false;
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open("shiftboard",1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function idbPut(k,v){try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}catch(e){return false}}
async function idbGet(k){try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction("files").objectStore("files").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}
function loadImage(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}
function monthInfo(y,m){const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();return{first,days,rows:Math.ceil((first+days)/7)}}
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

$("#calFile").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  const raw=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
  let img; try{img=await loadImage(raw)}catch(err){toast("That file couldn't be opened as an image");return}
  const max=2600, sc=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  calURL=c.toDataURL("image/jpeg",0.9);calImg=await loadImage(calURL);
  const ok=await idbPut("cal",calURL);
  if(!ok)toast("Calendar loaded, but it won't be remembered after you close the page");
  const now=new Date();S.cal={y:now.getFullYear(),m:now.getMonth(),pts:null};save();
  calStep=1;calPts=[];e.target.value="";render();
});

function renderSafety(v){
  if(!calImg){
    v.innerHTML=`<h2>Today's safety topic</h2><p class="sub">Upload this month's safety calendar once. The app zooms into each day's box so you can read it at the start-up meeting.</p>
    <div class="empty"><p>No calendar yet. A straight-on screenshot or PDF export works best. Angled photos make the boxes harder to line up.</p>
    <button class="btn" id="upl">Upload calendar image</button></div>
    <p class="note" style="margin-top:14px">The image stays on this phone. It is not sent anywhere.</p>`;
    $("#upl").onclick=()=>$("#calFile").click();return;
  }
  if(calStep>0||!S.cal||!S.cal.pts){return renderCalibrate(v)}
  const {y,m,pts}=S.cal, info=monthInfo(y,m);
  if(!curDay){const t=new Date();curDay=(t.getFullYear()===y&&t.getMonth()===m)?t.getDate():1}
  const date=new Date(y,m,curDay), wd=date.toLocaleDateString(undefined,{weekday:"long"});
  const isToday=(()=>{const t=new Date();return t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===curDay})();
  v.innerHTML=`<div class="dayhead"><div><div class="w">${esc(wd)}${isToday?' · <span class="pill good">Today</span>':""}</div><div class="d">${MONTHS[m]} ${curDay}</div></div></div>
   <canvas id="cell" aria-label="Safety topic for ${MONTHS[m]} ${curDay}"></canvas>
   <div class="daynav"><button class="btn ghost" id="prev" ${curDay<=1?"disabled":""}>◀ Prev</button><button class="btn ghost" id="today">Today</button><button class="btn ghost" id="next" ${curDay>=info.days?"disabled":""}>Next ▶</button></div>
   <div class="row" style="margin-top:16px"><button class="btn ghost" id="full">${showFull?"Hide":"Show"} full calendar</button></div>
   <div id="fullwrap" ${showFull?"":"hidden"} style="margin-top:12px"><div class="calwrap" id="cw"><img src="${calURL}" alt="Full safety calendar"></div></div>
   <div class="sec">Calendar</div>
   <div class="row"><button class="btn ghost" id="realign">Re-align boxes</button><button class="btn ghost" id="replace">New month's calendar</button></div>`;
  drawCell(pts,info,y,m);
  const cw=$("#cw");const r=cellRect(pts,info,curDay);const hl=document.createElement("div");hl.className="hl";
  Object.assign(hl.style,{left:r.x*100+"%",top:r.y*100+"%",width:r.w*100+"%",height:r.h*100+"%"});cw.appendChild(hl);
  $("#prev").onclick=()=>{curDay=Math.max(1,curDay-1);render()};
  $("#next").onclick=()=>{curDay=Math.min(info.days,curDay+1);render()};
  $("#today").onclick=()=>{const t=new Date();curDay=(t.getFullYear()===y&&t.getMonth()===m)?t.getDate():1;if(!(t.getFullYear()===y&&t.getMonth()===m))toast(`This calendar is for ${MONTHS[m]} ${y}`);render()};
  $("#full").onclick=()=>{showFull=!showFull;render()};
  $("#realign").onclick=()=>{calStep=1;calPts=[];render()};
  $("#replace").onclick=()=>$("#calFile").click();
}
function cellRect(pts,info,day){const [a,b]=pts;const cw=(b.x-a.x)/7,ch=(b.y-a.y)/info.rows;const idx=info.first+day-1;
  return{x:a.x+(idx%7)*cw,y:a.y+Math.floor(idx/7)*ch,w:cw,h:ch}}
function drawCell(pts,info){
  const cv=$("#cell");if(!cv)return;const r=cellRect(pts,info,curDay);
  /* calendar text often spills past its box, so include a slice of the next box on the right */
  const sx=Math.max(0,(r.x-r.w*0.02)*calImg.width), sy=r.y*calImg.height;
  const sw=Math.min(calImg.width-sx,r.w*1.3*calImg.width), sh=r.h*calImg.height;
  const cssW=cv.clientWidth||340, dpr=window.devicePixelRatio||1;
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssW*dpr*(sh/sw));cv.style.height=(cssW*sh/sw)+"px";
  const ctx=cv.getContext("2d");ctx.imageSmoothingQuality="high";ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(calImg,sx,sy,sw,sh,0,0,cv.width,cv.height);
}
function renderCalibrate(v){
  const now=new Date();const y=S.cal?S.cal.y:now.getFullYear(),m=S.cal?S.cal.m:now.getMonth();
  const step=calPts.length===0?`<b>Step 1 of 2.</b> Tap the <b>top-left corner</b> of the first week's <b>Sunday</b> box (the top-left of the grid, just under the day names).`
    :`<b>Step 2 of 2.</b> Tap the <b>bottom-right corner</b> of the last week's <b>Saturday</b> box (the bottom-right of the grid).`;
  const yrs=[now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1];
  v.innerHTML=`<h2>Line up the calendar</h2><p class="sub">Two taps tell the app where the day boxes are. You only do this once per month.</p>

/* local deliveries and containers from the same carrier are counted separately */
function eodCalc(){const E=S.eod;const by={};
  E.hawbs.forEach(h=>{const t=E.trucks[n(h.tr)-1];if(!t||!t.c||!has(h.h))return;const k=t.c+(t.cont?"|C":"");by[k]=by[k]||{d:0,g:0};by[k].d+=n(h.q);if(has(h.gr))by[k].g+=n(h.q)});
  return by}
const tkColor=i=>`var(--t${(i%8)+1})`;
const tkName=(t,i)=>`Truck ${i+1}${t&&t.c?" · "+t.c:""}${t&&t.cont?" container":""}`;
function emailText(){const E=S.eod,by=eodCalc(),L=["Hi team,",""];
  S.carriers.forEach(c=>[["","pallets"],["|C","container pallets"]].forEach(([suf,word])=>{const x=by[c+suf];if(!x||!x.d)return;
    L.push(x.d===x.g?`• There were ${x.d} ${word} delivered and GR'd from ${c} today.`:`• There were ${x.d} ${word} delivered and ${x.g} GR'd from ${c} today.`)}));
  E.hawbs.forEach(h=>{if(has(h.h)&&has(h.n))L.push(`• HAWB: ${h.h} – ${h.n}`)});
  if(has(E.put))L.push(`• We put away ${E.put} pallets.`);
  if(has(E.expA)||has(E.expC))L.push(`• We are expecting ${n(E.expA)} pallets from ${S.carriers[0]||"Carrier 1"} and ${n(E.expC)} pallets from containers tomorrow.`);
  L.push("","Thank you,");return L.join("\n")}
function spRows(){const E=S.eod;let d="";if(E.date){const [y,m,dd]=E.date.split("-");d=`${+m}/${+dd}/${y}`}
  const out=[[d,"","","","","",""].join("\t")];
  E.hawbs.forEach(h=>{if(!has(h.h))return;const t=E.trucks[n(h.tr)-1]||{};const gr=parseTime(h.gr),tt=parseTime(t.t);
    out.push([t.cont?"Container":"",h.h,h.q||"",tt==="?"?"":tt,gr==="?"?"":gr,h.rb||"",h.n||""].join("\t"))});
  return out.join("\n")}
let lastContainer=null;
function parseContainer(text){
  const lines=String(text||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const isCont=t=>/^[A-Z]{3}[UJZ]\d{7}$/.test(t);
  const isHouse=t=>/^[A-Z]{4,}\d{5,}$/.test(t)&&!isCont(t);
  const tokens=[];lines.forEach(l=>l.split(/\t|\s{2,}/).forEach(t=>{t=t.trim();if(t)tokens.push(t)}));
  /* Each IB DO line (a number starting with 60) is one pallet. It belongs to the next Master/House No. after it.
     If a sheet has no 60 numbers, fall back to counting how often each Master/House No. appears. */
  const isDO=t=>/^60\d{6,}$/.test(t);
  const counts={},order=[],conts=new Set(),houseHits={};let pending=0,doTotal=0;
  tokens.forEach(t=>{const u=t.toUpperCase();
    if(isDO(u)){pending++;doTotal++;return}
    if(isCont(u)){conts.add(u);return}
    if(isHouse(u)){if(!(u in counts)){counts[u]=0;houseHits[u]=0;order.push(u)}houseHits[u]++;if(pending){counts[u]+=pending;pending=0}}});
  if(!doTotal)order.forEach(u=>counts[u]=houseHits[u]);
  else if(pending&&order.length)counts[order[order.length-1]]+=pending;
  let carrier="";for(const t of tokens){const m=S.carriers.find(c=>c.toLowerCase()===t.toLowerCase());if(m){carrier=m;break}}
  let sheetSkids=null,units=null;
  for(let i=0;i<tokens.length;i++){if(/^skids?$/i.test(tokens[i])&&i>0){sheetSkids=n(tokens[i-1].replace(/,/g,""));if(i>1)units=tokens[i-2];break}
    const m=tokens[i].match(/^([\d,]+)\s*skids?$/i);if(m){sheetSkids=n(m[1].replace(/,/g,""));if(i>0)units=tokens[i-1];break}}
  return{carrier,containers:[...conts],houses:order.map(no=>({no,skids:counts[no]})),sheetSkids,units};
}
function containerSummary(r){const tot=r.houses.reduce((a,h)=>a+h.skids,0);
  const match=r.sheetSkids==null?"":(r.sheetSkids===tot?` <span class="pill good">matches ${r.sheetSkids} on sheet</span>`:` <span class="pill bad">sheet says ${r.sheetSkids}</span>`);
  return `<b>Last container read:</b> ${esc(r.carrier||"carrier not found")} · ${esc(r.containers.join(", ")||"no container #")}<br>`+
    r.houses.map(h=>`${esc(h.no)}: ${h.skids} skids`).join("<br>")+match+(r.units&&/^[\d,]+$/.test(r.units)?`<br>${esc(r.units)} units`:"")+
    (r.carrier?"":`<br><span style="color:var(--bad)">Pick the carrier on the new truck. Add it in Settings if it's missing.</span>`)}

  $("#edate").oninput=e=>{E.date=e.target.value;save()};

  E.trucks.forEach((t,i)=>{const el=$("#tt"+i);if(!el)return;const p=parseTime(t.t);el.textContent=p==="?"?"That time doesn't look right":p?`Transfer ${p}`:"";el.style.color=p==="?"?"var(--bad)":""});
  E.hawbs.forEach((h,i)=>{const el=$("#hw"+i);if(!el)return;const g=parseTime(h.gr);const t=E.trucks[n(h.tr)-1];
    el.textContent=g==="?"?"GR time doesn't look right":[t&&t.t&&parseTime(t.t)!=="?"?"Transfer "+parseTime(t.t):"",g?"GR "+g:"Not GR'd yet"].filter(Boolean).join(" · ");el.style.color=g==="?"?"var(--bad)":""});
  $("#email").textContent=emailText()}

/* ---------- SETTINGS ---------- */
function renderSettings(v){
  v.innerHTML=`<h2>Settings</h2><p class="sub">Everything you enter is kept in this phone's browser only. Nothing is sent to anyone.</p>
   <div class="sec">Carriers</div><div class="card"><label class="f">One per line. The first one is used for "expected tomorrow" in the EOD email.<textarea id="scar" rows="6">${esc(S.carriers.join("\n"))}</textarea></label></div>
   <div class="sec">Morning areas</div><div class="card"><label class="f">One per line, in the order you walk them.<textarea id="sarea" rows="10">${esc(S.areas.join("\n"))}</textarea></label></div>
   <div class="row" style="margin-top:12px"><button class="btn" id="ssave">Save settings</button><button class="btn ghost" id="sback">Back</button></div>
   <div class="sec">Reset</div><div class="card"><p class="note" style="margin-top:0">Clears every tab, the settings and the safety calendar from this phone.</p><button class="btn warn" id="sreset">Erase everything</button></div>`;
  $("#ssave").onclick=()=>{const c=$("#scar").value.split("\n").map(s=>s.trim()).filter(Boolean),a=$("#sarea").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!c.length){toast("Add at least one carrier");return}
    const old={};S.areas.forEach((x,i)=>old[x]=S.morning[i]);const nm={};a.forEach((x,i)=>{if(old[x])nm[i]=old[x]});
    S.carriers=c;S.areas=a;S.morning=nm;save();toast("Settings saved")};
  $("#sback").onclick=()=>go("safety");
  $("#sreset").onclick=e=>armClear(e.target,async()=>{S=JSON.parse(JSON.stringify(DEF));save();calImg=null;calURL=null;await idbPut("cal",null);go("safety");toast("Everything erased")});
}

/* ---------- boot ---------- */
(async function(){
  setSaveState();
  const url=await idbGet("cal");
  if(url){try{calURL=url;calImg=await loadImage(url)}catch(e){calImg=null}}
  go(S.tab||"safety");
})();
})();
</script>
